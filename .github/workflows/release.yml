# Build and publish the release tarballs when a version tag is pushed.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The page bundle in internal/web/dist is committed, so this needs only Go: no
# Node, no frontend build. If the page changes, rebuild it and commit the
# result before tagging, or the release will carry the old page.
name: release

on:
  push:
    tags:
      - "v*"
  # Useful for checking the build without publishing anything.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag that disagrees with internal/version/version.go would ship
      # tarballs whose names do not match the binary's own idea of itself.
      - name: check the tag matches the version in the source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          source_version=$(sed -n 's/^const Version = "\(.*\)"/\1/p' internal/version/version.go)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$source_version" != "$tag_version" ]; then
            echo "tag is $tag_version but internal/version/version.go says $source_version"
            exit 1
          fi

      - name: test
        run: go test ./...

      - name: build the tarballs
        run: make -f release.mk release

      - name: show what was built
        run: make -f release.mk list-assets

      - name: upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/fleet_*.tar.gz dist/checksums.txt install.sh
